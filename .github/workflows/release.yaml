name: Release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match the version in Cargo.toml)
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    if: github.repository == 'astral-sh/char_str'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi

          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "char_str") | .version')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "release tag $RELEASE_TAG does not match char_str v$version" >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release
        run: cargo build --locked --release --all-features

      - name: Verify package
        run: cargo publish --locked --package char_str --dry-run

  release:
    name: Create tag and GitHub Release
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no release notes for char_str $RELEASE_VERSION" >&2
            exit 1
          fi

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$tag_sha" ]; then
            tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "release tag $RELEASE_TAG already points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists at $GITHUB_SHA"
            exit 0
          fi

          args=(
            --title "$RELEASE_TAG"
            --notes-file "$notes"
          )
          if [ -n "$tag_sha" ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${args[@]}"

  publish:
    name: Publish to crates.io
    needs:
      - build
      - release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/char_str/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish char_str
        run: cargo publish --locked --package char_str
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
