name: Publish to crates.io

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    name: cargo publish
    if: github.repository == 'astral-sh/char_str'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Install Rust toolchain
        run: rustup show
      - name: Validate release tag
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "char_str") | .version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "release tag $GITHUB_REF_NAME does not match char_str v$version" >&2
            exit 1
          fi
      - name: Publish char_str
        run: cargo publish --locked --package char_str
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
